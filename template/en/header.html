<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="keywords" content="{if isset($keywords) && $keywords}{$keywords}{else}{cms:setting name="site.keywords"}{/if}">
<meta name="description" content="{if isset($description) && $description}{$description}{else}{cms:setting name="site.description"}{/if}">
<title>{if isset($seo_title) && $seo_title}{$seo_title}{else}{cms:setting name="site.name"}{/if}</title>
<link rel="stylesheet" href="/template/en/css/style.css">
</head>
<body>
<div class="topbar"><div class="container">
  <span>Welcome to {cms:setting name="site.name"}</span>
  <span class="top-actions">
    {foreach :lang_codes() as $lc}
      <a href="{:url_lang($lc)}" class="{if $lc == lang_code()}on{/if}">{if $lc=='cn'}中文{else}EN{/if}</a>
    {/foreach}
    <span class="sep">|</span>
    {if $is_wap}
      <a href="{:site_url('device','set',['client'=>'pc','back'=>$cur_url])}">PC</a>
    {else}
      <a href="{:site_url('device','set',['client'=>'mobile','back'=>$cur_url])}">Mobile</a>
    {/if}
    <span class="sep">|</span>
    <a href="/admin">Admin</a>
  </span>
</div></div>

<header class="header">
  <div class="container">
    <a class="logo" href="{:url_home()}">E<em>Cloud</em>CMS</a>
    <nav class="nav">
      <a href="{:url_home()}" {if $cur_catid == 0}class="active"{/if}>Home</a>
      {cms:category parent="0" item="cat"}
        <a href="{:url_cat($cat)}" {if $cur_catid == $cat.id}class="active"{/if}>{$cat.name}</a>
      {/cms:category}
    </nav>
    <form class="search" action="{:site_url('search','index')}" method="get">
      <input type="hidden" name="field" value="all">
      <select name="catid">
        <option value="0">All</option>
        {cms:category parent="0" item="cat"}
          <option value="{$cat.id}" {if isset($catid) && $catid == $cat.id}selected{/if}>{$cat.name}</option>
        {/cms:category}
      </select>
      <input type="text" name="kw" value="{if isset($kw)}{$kw}{/if}" placeholder="Search title or content">
      <button type="submit">Search</button>
    </form>
  </div>
</header>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{$title ?? '商品商城'} - {$site_name ?? '易云CMS'}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#f2f4f7;color:#333}
a{color:#1e6fff;text-decoration:none}
.top{background:#1a2744;color:#fff;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between}
.top b{font-size:16px}
.top a{color:#aebbe0;font-size:13px;margin-left:16px}
.wrap{max-width:1100px;margin:24px auto 40px;padding:0 16px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(20,40,80,.06);display:flex;flex-direction:column}
.card .img{aspect-ratio:4/3;background:#f0f2f5;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover}
.card .bd{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.card .t{font-size:14px;line-height:1.45;height:40px;overflow:hidden}
.card .price{color:#e02e24;font-size:18px;font-weight:700}
.card .price small{font-size:12px;color:#98a1b3;font-weight:400;margin-left:6px;text-decoration:line-through}
.card .btn-row{display:flex;gap:8px}
.btn{display:inline-block;padding:8px 16px;border-radius:8px;font-size:14px;text-align:center;background:#1e6fff;color:#fff;cursor:pointer;border:0}
.btn:hover{background:#0f56e0}
.btn.gray{background:#eef1f5;color:#5a6579}
.pager{display:flex;justify-content:center;gap:6px;margin-top:24px}
.pager a,.pager span{padding:6px 12px;border-radius:6px;background:#fff;font-size:13px;color:#5a6579}
.pager .cur{background:#1e6fff;color:#fff}
.empty{text-align:center;padding:60px 0;color:#98a1b3}
</style>
</head>
<body>
<div class="top"><b>商品商城</b><span>
  <a href="/shop/cart">购物车</a>
  <a href="/shop/order_list">我的订单</a>
  {if $member}<a href="/member/center">会员中心</a>{else}<a href="/member/login">登录</a>{/if}
  <a href="/">返回首页</a></span>
</div>
<div class="wrap">
  <div class="toolbar">
    <form method="get" action="/shop/index" style="display:flex;gap:8px">
      <input type="text" name="keyword" placeholder="搜索商品" value="{$keyword}" style="height:38px;border:1px solid #dde1e8;border-radius:8px;padding:0 12px;outline:none">
      <button class="btn">搜索</button>
    </form>
  </div>
  {if count($list)>0}
  <div class="grid">
    {foreach $list as $row}
    <div class="card">
      <a class="img" href="/shop/goods?id={$row.id}">{if $row.thumb}<img src="{$row.thumb}" alt="{$row.title}">{/if}</a>
      <div class="bd">
        <a class="t" href="/shop/goods?id={$row.id}">{$row.title}</a>
        <div class="price">¥{$row.price}{if $row.original_price>0}<small>¥{$row.original_price}</small>{/if}</div>
        <div class="btn-row">
          <a class="btn gray" href="/shop/goods?id={$row.id}">查看详情</a>
        </div>
      </div>
    </div>
    {/foreach}
  </div>
  <div class="pager">{$list|raw}</div>
  {else}
  <div class="empty">暂无商品，请稍后再来</div>
  {/if}
</div>
</body>
</html>

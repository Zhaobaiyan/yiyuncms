<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线客服 - 会员中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#f2f4f7;color:#333}
a{color:#1e6fff;text-decoration:none}
.top{background:#1a2744;color:#fff;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between}
.top b{font-size:16px}
.top a{color:#aebbe0;font-size:13px;margin-left:16px}
.wrap{max-width:760px;margin:24px auto 40px;padding:0 16px}
.chat{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(20,40,80,.06);display:flex;flex-direction:column;height:560px}
.chat-head{padding:14px 20px;border-bottom:1px solid #eef1f5;display:flex;align-items:center;justify-content:space-between;font-size:14px}
.chat-head .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:6px}
.msg-box{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;max-width:72%}
.msg .meta{font-size:12px;color:#98a1b3;margin-bottom:4px}
.msg .bubble{padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.6;background:#f0f2f5;word-break:break-word}
.msg.cus{align-self:flex-end;align-items:flex-end}
.msg.cus .bubble{background:#1e6fff;color:#fff}
.msg.kf{align-self:flex-start;align-items:flex-start}
.input-bd{border-top:1px solid #eef1f5;padding:12px 16px;display:flex;gap:10px}
.input-bd input{flex:1;height:42px;border:1px solid #dde1e8;border-radius:8px;padding:0 12px;font-size:14px;outline:none}
.input-bd input:focus{border-color:#1e6fff}
.btn{height:42px;padding:0 24px;border-radius:8px;background:#1e6fff;color:#fff;border:0;cursor:pointer;font-size:14px}
.btn:hover{background:#0f56e0}
.sys-tip{text-align:center;font-size:12px;color:#98a1b3}
</style>
</head>
<body>
<div class="top"><b>在线客服</b><span>
  <a href="/member/center">会员中心</a>
  <a href="/">返回首页</a></span>
</div>
<div class="wrap">
  <div class="chat">
    <div class="chat-head">
      <span><span class="dot"></span>客服在线，欢迎咨询</span>
      <span style="font-size:12px;color:#98a1b3">客服消息自动刷新</span>
    </div>
    <div class="msg-box" id="msg-box">
      <div class="sys-tip">会话已创建，请描述您的问题</div>
      {foreach $messages as $m}
      <div class="msg {if $m.from_type==1}cus{else}kf{/if}">
        <div class="meta">{if $m.from_type==1}我{else}客服{/if} · {$m.create_time|date='H:i'}</div>
        <div class="bubble">{$m.content}</div>
      </div>
      {/foreach}
    </div>
    <div class="input-bd">
      <input type="text" id="txt" placeholder="输入消息，回车发送" onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="btn" onclick="sendMsg()">发送</button>
    </div>
  </div>
</div>
<script>
var lastId = {if count($messages)>0}{:end($messages)['id']}{else}0{/if};
var closed = false;
function sendMsg(){
  var content=document.getElementById('txt').value.trim();
  if(!content)return;
  document.getElementById('txt').value='';
  var fd=new URLSearchParams();
  fd.set('session_id','{$session.id}');
  fd.set('content',content);
  fetch('/service/send',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()})
   .then(function(r){return r.json()}).then(function(j){
    if(j.code!==1){ alert(j.msg); }
  });
  pollOnce();
}
function addMsg(m){
  var box=document.getElementById('msg-box');
  var div=document.createElement('div');
  div.className='msg '+(m.from_type===1?'cus':'kf');
  div.innerHTML='<div class="meta">'+(m.from_type===1?'我':'客服')+' · '+m.time+'</div><div class="bubble">'+m.content+'</div>';
  box.appendChild(div); box.scrollTop=999999;
}
function pollOnce(){
  var fd=new URLSearchParams();
  fd.set('session_id','{$session.id}');
  fd.set('last_id',lastId);
  fetch('/service/poll',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()})
   .then(function(r){return r.json()}).then(function(j){
    if(j.code===1){
      if(j.list&&j.list.length){ j.list.forEach(function(m){ addMsg(m); lastId=m.id; }); }
      if(j.status===2 && !closed){
        closed=true;
        var box=document.getElementById('msg-box');
        var div=document.createElement('div');
        div.className='sys-tip'; div.textContent='客服已关闭本次会话，如需继续咨询请重新发起';
        box.appendChild(div);
      }
    }
  });
}
setInterval(pollOnce, 4000);
</script>
</body>
</html>

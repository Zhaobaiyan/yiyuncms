<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - 页面不存在 - 易云CMS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f5f6f8;height:100vh;display:flex;align-items:center;justify-content:center;color:#333}
.wrap{text-align:center}
.num{font-size:110px;font-weight:700;color:#2563eb;line-height:1;letter-spacing:4px}
.t{font-size:22px;margin:10px 0 6px}
.p{color:#8a94a6;font-size:14px;margin-bottom:28px}
.btn{display:inline-block;padding:10px 30px;background:#2563eb;color:#fff;border-radius:6px;text-decoration:none;font-size:14px}
.btn:hover{opacity:.9}
</style>
</head>
<body>
<div class="wrap">
  <div class="num">404</div>
  <div class="t">页面不存在或已被删除</div>
  <div class="p">您访问的页面可能已迁移、被删除或地址有误</div>
  <a class="btn" href="/">返回网站首页</a>
</div>
</body>
</html>
